[package]
name = "concat-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Montora's AI providers: the services a text or transcription task can run on, and the keys the user gave for them."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# Every provider is reached over the OpenAI-compatible HTTP protocol, with a
# blocking client: an AI task runs on a worker thread like every other long
# job in the engine, and an async stack would be a runtime's worth of
# dependencies for a few POSTs. The same major as concat-host's.
ureq = "2"

# The user's API keys go to the system's own credential store, never into
# settings.json: the macOS Keychain, the Windows Credential Manager, and the
# Secret Service on Linux (GNOME Keyring, KWallet), the last through zbus,
# which is pure Rust, so no libdbus has to be on the build machine or named
# by the packages. Android has no store keyring reaches; see secrets.rs.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[lints]
workspace = true
