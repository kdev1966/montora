# Dependabot keeps two kinds of pin current, monthly, as pull requests that
# CI tests like any other. Monthly, and never rebased on its own: each of
# its pull requests runs the hour-long macOS job, and while Montora is
# being made solid on macOS the bumps are taken in one batch, when chosen
# ("@dependabot rebase" brings one up to date). Security updates still come
# on their own, as they are found.
#
# - The actions every workflow uses, each pinned to a commit with its tag
#   in a comment. Dependabot moves the commit and the comment together.
# - The Rust dependencies in src/Cargo.lock, grouped into one pull request
#   a month, so a month's bumps are reviewed and tested once rather than
#   twenty times.
#
# Not covered: the prebuilt libraries in scripts/ci/deps.lock (FFmpeg,
# ONNX Runtime, sherpa-onnx, the packagers, LLVM, Intel's emulator), which
# are bumped by hand as that file says, and the toolchain in
# src/rust-toolchain.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /src
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
