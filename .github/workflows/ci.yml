name: CI

# The engine's tests and lints on every push and pull request. The bundles
# are built by release.yml, on a tag; see that file.
#
# One platform at a time: Montora is being made solid on macOS first, so
# this runs on macOS alone. Windows comes back here when its turn comes
# (docs/montora-0.3.0-plan.md); the jobs that ran it, and Linux, are in
# the history of this file.
#
# Every action is pinned to a commit, with the tag it was in a comment
# beside it: a tag can be moved to other code after a run has trusted it,
# a commit cannot. Dependabot proposes the bumps (.github/dependabot.yml).
# The prebuilt libraries the jobs download are pinned the same way, by
# digest, in scripts/ci/deps.lock.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this before it builds anything: a tag on a red tree
  # is not a release. It names the tag, because a release started by hand
  # runs on main, and main is not what it builds.
  workflow_call:
    inputs:
      ref:
        description: The ref to test, when it is not the one this runs on
        type: string
        default: ""

# Keyed on what is tested, so a release testing its tag and a push to
# main never cancel each other. Only a pull request's run is cancelled by
# the next push to it: a run on main is the record of whether main is
# green, and cancelling it leaves a gap where the answer should be.
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but documentation changed. A change to docs/ or to a
  # Markdown file at the root alone skips the macOS job: it would build the engine for
  # an hour to test text. The job is skipped, not left out with a paths
  # filter on the trigger: main's protection asks for "macOS tests and
  # lints", a skipped job reports success, and a job that never starts
  # would hold a documentation pull request open for good. The READMEs
  # count as code: locales.py checks there is one per language, and a
  # Markdown file under src/ can be compiled in (include_str!). A release, a
  # run by hand, or a list of files GitHub cuts short tests everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$REF" ]; then
            files=""
          elif [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
            # GitHub lists 3000 files at most.
            [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ] && files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files=""
            # A comparison lists 300 files at most.
            [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ] && files=""
          else
            files=""
          fi
          code=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | awk '
                /(^|\/)README[^\/]*\.md$/ || !/^(docs\/|[^\/]+\.md$)/ { found = 1 }
                END { exit !found }'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n%s\nTest the engine: %s\n' "${files:-(all)}" "$code"

  # The lints and the tests run side by side, each on a Mac of its own:
  # the lints compile the workspace for checking only, the tests compile
  # it for running, and one after the other on one Mac they took the sum
  # of both. "macOS tests and lints", the check main's protection asks
  # for, is the job at the end that reports both.
  lints:
    name: macOS lints
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Apple silicon: GitHub's arm64 runners are the quicker and the more
    # available. The Intel build is made and checked by build-app.yml.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/rust-macos

      - run: cargo fmt --check
        working-directory: src
      # Every string the interface shows is a key in a locale file; this
      # keeps en.json the inventory of them and every shipped language
      # keyed off it. See docs/TRANSLATING.md.
      - run: python3 scripts/locales.py --check
      # The engine's model tables and models/manifest.toml say the same.
      - run: python3 scripts/models.py --check
      # -D warnings covers rustc lints too (missing_docs among them).
      - run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 45
        working-directory: src
      # The gRPC transport is a feature nothing else in the workspace turns
      # on, so it is linted on its own. See concat-server.
      - run: cargo clippy -p concat-server -p concat-cli --features grpc --all-targets -- -D warnings
        timeout-minutes: 15
        working-directory: src

  tests:
    name: macOS tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # No GPU tests are forced here (CONCAT_REQUIRE_GPU is not set): a
    # runner's virtual GPU is not the one a Mac has.
    runs-on: macos-15
    # The steps that can run long have timeouts of their own, so a stuck
    # step is named by its own timeout; this is for a job stuck elsewhere.
    timeout-minutes: 150
    env:
      # No debug info in the test binaries: smaller, faster to link, and
      # nothing reads it here.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/rust-macos
        with:
          nextest: "true"

      # The tests are compiled in a step of their own, so a slow compile
      # and a slow test are told apart by which step ran out of time.
      - name: Build the tests
        timeout-minutes: 80
        working-directory: src
        run: cargo nextest run --workspace --no-run
      - name: Run the tests
        timeout-minutes: 30
        working-directory: src
        run: |
          status=0
          cargo nextest run --workspace --profile ci 2>&1 | tee nextest-workspace.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-workspace.xml 2>/dev/null || true
          exit "$status"
      # nextest does not run the examples in the documentation; cargo does.
      - name: Run the documentation's examples
        timeout-minutes: 15
        working-directory: src
        run: cargo test --workspace --doc
      - name: Run the gRPC tests
        timeout-minutes: 15
        working-directory: src
        run: |
          status=0
          cargo nextest run -p concat-server --features grpc --profile ci 2>&1 | tee nextest-grpc.log || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-grpc.xml 2>/dev/null || true
          exit "$status"

      - name: Keep the test report (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-macos
          path: |
            src/target/nextest/ci/*.xml
            src/nextest-*.log
          if-no-files-found: ignore

  # The check main's protection asks for. It runs whatever happened above,
  # and passes when both jobs passed, or when both were skipped because
  # only documentation changed; anything else, a failure or a cancelled
  # job, fails it.
  macos:
    name: macOS tests and lints
    needs: [changes, lints, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          LINTS: ${{ needs.lints.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "changes: $CHANGES, code: $CODE, lints: $LINTS, tests: $TESTS"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then
            [ "$LINTS" = success ] && [ "$TESTS" = success ]
          else
            [ "$LINTS" = skipped ] && [ "$TESTS" = skipped ]
          fi
